<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VedASIC Studio</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script><script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script><script>window.require={paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs'}};</script><script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script><script src="https://cdn.jsdelivr.net/npm/wavedrom@3.5.0/wavedrom.min.js"></script><link rel="stylesheet" href="styles.css"><style>body{overflow:hidden}.studio{height:calc(100vh - 75px);display:grid;grid-template-columns:1fr 1fr;background:#050914}.pane{min-width:0;border-right:1px solid rgba(92,210,255,.16)}.editor-wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto}.bar{padding:10px 14px;background:#08111f;border-bottom:1px solid rgba(92,210,255,.16);display:flex;justify-content:space-between;align-items:center}.tab{font-family:'Space Mono';font-size:12px;color:#8da2ba}.run{border:0;border-radius:8px;padding:9px 15px;background:#55ddff;color:#03101c;font-weight:800;cursor:pointer}.run:disabled{opacity:.5;cursor:wait}.editor{min-height:0}.bottom{height:170px;overflow:auto;background:#02060e;padding:14px;font-family:'Space Mono';font-size:12px}.output-title{color:#55ddff;margin-bottom:8px}.error{color:#ff7d96;white-space:pre-wrap}.ok{color:#65f1b1}.wave{height:100%;overflow:auto;padding:20px;background:#07101d}.wave h3{font-size:14px;color:#55ddff;font-family:'Space Mono';margin:0 0 12px}.status{font-family:'Space Mono';font-size:11px}.studio-head{height:75px}@media(max-width:900px){.studio{grid-template-columns:1fr;overflow:auto;height:auto}.pane{min-height:500px}.studio-head nav{display:none}}</style></head><body><header class="site-header studio-head"><div class="brand"><img src="logo.png" class="logo"><span>VedASIC Studio</span></div><nav><a href="index.html">← Website</a><span class="status" id="connection">Backend: checking...</span></nav></header><div id="root"></div><script type="text/babel">const {useEffect,useState}=React;const API='http://127.0.0.1:8000';const defaultRTL=`module and_gate(\n    input a,\n    input b,\n    output y\n);\n\nassign y = a & b;\n\nendmodule`;const defaultTB=`module tb;\nreg a;\nreg b;\nwire y;\n\nand_gate dut(\n  .a(a), .b(b), .y(y)\n);\n\ninitial begin\n  $dumpfile("dump.vcd");\n  $dumpvars(0, tb);\n  $monitor("a=%b b=%b y=%b", a, b, y);\n  a=0; b=0; #10;\n  a=0; b=1; #10;\n  a=1; b=0; #10;\n  a=1; b=1; #10;\n  $finish;\nend\nendmodule`;function App(){const[rtl,setRtl]=useState(defaultRTL),[tb,setTb]=useState(defaultTB),[output,setOutput]=useState('Ready. Write RTL and testbench, then run simulation.'),[err,setErr]=useState(''),[busy,setBusy]=useState(false),[wave,setWave]=useState(null);useEffect(()=>{window.require(['vs/editor/editor.main'],()=>{window.monaco.editor.create(document.getElementById('rtl'),{value:rtl,language:'verilog',theme:'vs-dark',automaticLayout:true,minimap:{enabled:false},fontSize:14});window.monaco.editor.create(document.getElementById('tb'),{value:tb,language:'verilog',theme:'vs-dark',automaticLayout:true,minimap:{enabled:false},fontSize:14});const ed=window.monaco.editor.getModels();window.rtlModel=ed[0];window.tbModel=ed[1];});fetch(API+'/').then(()=>document.getElementById('connection').textContent='Backend: online').catch(()=>document.getElementById('connection').textContent='Backend: offline');},[]);async function run(){setBusy(true);setErr('');setOutput('Compiling and simulating...');try{const r=await fetch(API+'/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({verilog_code:window.rtlModel?.getValue()||rtl,testbench_code:window.tbModel?.getValue()||tb})});const d=await r.json();if(!d.success){setErr(d.error||'Simulation failed.');setOutput(d.stage||'error');setWave(null)}else{setOutput(d.output||'Simulation completed successfully.');setWave(d.waveform||null)}}catch(e){setErr('Cannot reach FastAPI. Start the backend with: uvicorn backend.main:app --reload');setOutput('Connection error')}finally{setBusy(false)}}return <div className="studio"><section className="pane editor-wrap"><div className="bar"><span className="tab">design.v</span><button className="run" disabled={busy} onClick={run}>{busy?'RUNNING...':'▶ RUN SIMULATION'}</button></div><div className="grid grid-rows-2 min-h-0"><div id="rtl" className="editor"></div><div id="tb" className="editor border-t border-slate-800"></div></div><div className="bottom"><div className="output-title">SIMULATION OUTPUT</div><div className={err?'error':'ok'}>{err||output}</div></div></section><section className="wave"><h3>WAVEFORM / DIAGNOSTICS</h3>{wave?<div><pre className="text-xs text-slate-400 whitespace-pre-wrap">{JSON.stringify(wave,null,2)}</pre><div className="mt-5 border border-slate-800 rounded-lg p-4"><div className="text-sm text-slate-300 mb-2">Signals detected: {wave.signals?.join(', ')||'none'}</div><div className="text-xs text-slate-500">VCD trace received from the simulator. This panel is the integration point for the final WaveDrom renderer.</div></div></div>:<div className="text-slate-500 text-sm leading-7">Run the example to populate simulation diagnostics.<br/>Next layer: render the returned VCD vectors with WaveDrom and add Three.js/WebGL physical-design visuals.</div>}</section></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
